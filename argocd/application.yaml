# Application GitOps surveillee par Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bijouterie
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/digitalartist221/devops-bijouterie.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: bijouterie
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

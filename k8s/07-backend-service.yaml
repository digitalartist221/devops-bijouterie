# Service interne qui distribue les requetes entre les deux pods backend.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: bijouterie
    tier: backend
  ports:
    - name: http
      port: 3000
      targetPort: http

# Deployment de la base MySQL. Il n'y a qu'une seule copie de la base.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bijouterie
      tier: database
  template:
    metadata:
      labels:
        app: bijouterie
        tier: database
    spec:
      containers:
        - name: mysql
          image: digitalartistsn/bijouterie-mysql:2
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          # Toutes les variables du Secret sont injectees d'un coup.
          envFrom:
            - secretRef:
                name: mysql-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 10
